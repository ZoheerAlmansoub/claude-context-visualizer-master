name: Bug report
description: Report a problem with sessions, analysis, or the UI
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug.

  - type: dropdown
    id: agent
    attributes:
      label: Agent / transcript source
      options:
        - Claude Code
        - Cursor
        - Pi
        - OpenCode
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version or commit
      placeholder: e.g. 0.1.0 or git SHA
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the app with ...
        2. Open session ...
        3. Click ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Redact paths, API keys, and private session content.
      render: shell
